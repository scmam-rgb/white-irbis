name: fetch-commons
on:
  push:
    branches: [fetch-img]
    paths: [tools/queries.txt]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/commons.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add cand && git commit -m "Commons candidates" && git push
