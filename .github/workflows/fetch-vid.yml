name: fetch-vid
on:
  push:
    branches: [fetch-vid]
    paths: [tools/vqueries.txt]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/commons_vid.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add vcand && git commit -m "video candidates" && git push
